name: Validate and refresh public-health data
on:
  push:
    branches: [main]
    paths: ["scripts/update_data.py", "scripts/update_advisories.py", "tests/**", ".github/workflows/update-data.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: validated-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate publication and failure gates
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/test_data_client.cjs
          node tests/test_advisory_list.cjs
          node tests/test_outbreak_display.cjs
      - name: Fetch CDC and ECDC, compare, then publish atomically
        id: refresh
        continue-on-error: true
        run: python scripts/update_data.py
      - name: Read official travel alert levels and publication dates
        id: advisories
        if: success() || steps.refresh.outcome == 'failure'
        continue-on-error: true
        run: python scripts/update_advisories.py
      - name: Persist validated bundle or failed-check report
        if: always()
        run: |
          git config user.name "outbreak-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: persist source comparison and maintenance status"
          git push
      - name: Surface blocked update
        if: steps.refresh.outcome == 'failure' || steps.advisories.outcome == 'failure'
        run: |
          echo "::error::Source update blocked in part. Failed sources retain their last verified records. Inspect data/maintenance.json and data/advisory-maintenance.json."
          exit 1
